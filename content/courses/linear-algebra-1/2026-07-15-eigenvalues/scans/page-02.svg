<svg xmlns="http://www.w3.org/2000/svg" width="620" height="850" viewBox="0 0 620 850" font-family="serif">
  <rect width="620" height="850" fill="#faf6ec"/>
  <g stroke="#c9d6e8" stroke-width="1">
    <line x1="40" y1="120" x2="580" y2="120"/><line x1="40" y1="160" x2="580" y2="160"/>
    <line x1="40" y1="200" x2="580" y2="200"/><line x1="40" y1="240" x2="580" y2="240"/>
    <line x1="40" y1="280" x2="580" y2="280"/><line x1="40" y1="320" x2="580" y2="320"/>
    <line x1="40" y1="360" x2="580" y2="360"/><line x1="40" y1="400" x2="580" y2="400"/>
    <line x1="40" y1="440" x2="580" y2="440"/><line x1="40" y1="480" x2="580" y2="480"/>
    <line x1="40" y1="520" x2="580" y2="520"/><line x1="40" y1="560" x2="580" y2="560"/>
    <line x1="40" y1="600" x2="580" y2="600"/><line x1="40" y1="640" x2="580" y2="640"/>
    <line x1="40" y1="680" x2="580" y2="680"/><line x1="40" y1="720" x2="580" y2="720"/>
    <line x1="40" y1="760" x2="580" y2="760"/>
  </g>
  <line x1="560" y1="80" x2="560" y2="810" stroke="#e8b4b4" stroke-width="1.5"/>
  <text x="540" y="100" text-anchor="end" font-size="26" fill="#2a3550" font-weight="bold">דוגמה מהשיעור — עמ' 2</text>
  <text x="540" y="152" text-anchor="end" font-size="19" fill="#3a4a6b" transform="rotate(0.4 540 152)">A = [2 1; 1 2] — נמצא ערכים עצמיים</text>
  <text x="330" y="236" text-anchor="middle" font-size="21" fill="#1f2a44" font-style="italic">det(A − λI) = (2−λ)² − 1</text>
  <text x="330" y="316" text-anchor="middle" font-size="21" fill="#1f2a44" font-style="italic">= λ² − 4λ + 3 = (λ−1)(λ−3)</text>
  <text x="540" y="395" text-anchor="end" font-size="19" fill="#3a4a6b" transform="rotate(-0.5 540 395)">לכן: λ₁ = 1 , λ₂ = 3</text>
  <text x="540" y="475" text-anchor="end" font-size="19" fill="#3a4a6b" transform="rotate(0.3 540 475)">עבור λ₁ = 1 פותרים (A − I)v = 0</text>
  <text x="330" y="556" text-anchor="middle" font-size="21" fill="#1f2a44" font-style="italic">v₁ = (1, −1)ᵀ</text>
  <ellipse cx="330" cy="549" rx="90" ry="26" fill="none" stroke="#b35438" stroke-width="2" transform="rotate(1 330 549)"/>
  <text x="540" y="635" text-anchor="end" font-size="17" fill="#8a7a9b" transform="rotate(-1 540 635)">(בשוליים: מטריצה סימטרית ⇐ ע"ע ממשיים?)</text>
  <text x="300" y="835" text-anchor="middle" font-size="14" fill="#9a917e">— דף דוגמה (דמו) —</text>
</svg>
